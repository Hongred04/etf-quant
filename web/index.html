<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETF Quant · 核心-卫星轮动</title>
<script>
/* 首屏即定主题，避免闪白 */
(function () {
  try {
    var forced = new URLSearchParams(location.search).get("theme");
    var t = forced || localStorage.getItem("etfquant-theme");
    if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = "dark"; }
})();
</script>
<script>
/* 冒烟探针：只收集，不上报。正常浏览只占几个字节；
   scripts/ui_smoke.py 用 ?uismoke=1 读这些值做回归判断。 */
window.__errs = [];
window.addEventListener("error", function (e) {
  window.__errs.push(String((e && (e.message || e.error)) || "error"));
});
window.addEventListener("unhandledrejection", function (e) {
  window.__errs.push("reject: " + String(e && e.reason));
});
/* 兜底：如果 app 的 boot 直接崩了，主探针根本没机会执行。
   这里保证 5 秒后一定有一份带错误的报告，冒烟脚本才不会把崩溃看成"没加载完"。 */
if (/[?&]uismoke=1/.test(location.search)) {
  setTimeout(function () {
    if (document.title.indexOf("UISMOKE") === 0) return;
    var view = document.querySelector("#view");
    var de = document.documentElement;
    document.title = "UISMOKE " + JSON.stringify({
      page: "?", vw: innerWidth, sw: de.scrollWidth,
      overflow: de.scrollWidth > innerWidth + 1,
      empty: !(view && view.textContent && view.textContent.trim()),
      badText: false, kline: false, fallback: true,
      errs: (window.__errs || []).slice(0, 6)
    });
  }, 5000);
}
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="ambient"></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 17.5 8.2 11l3.9 3.4L21 5" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="21" cy="5" r="2.1" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">ETF Quant</div>
        <div class="brand-sub">CORE · SATELLITE</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-page="overview">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7.5" height="7.5" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>总览</span>
      </button>
      <button class="nav-item" data-page="signal">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3.4" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="0.9" fill="currentColor"/></svg>
        <span>买什么</span>
        <em class="nav-badge" id="navBadge"></em>
      </button>
      <button class="nav-item" data-page="myholdings">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.2c-4.9 0-8.8 3.5-8.8 7.9 0 4.4 3.9 7.9 8.8 7.9.9 0 1.8-.1 2.6-.4l4.2 2.1-1.1-3.6c2-1.4 3.1-3.6 3.1-6C20.8 6.7 16.9 3.2 12 3.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.4 12h.1M12 12h.1M15.6 12h.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>我的持仓</span>
      </button>
      <button class="nav-item" data-page="track">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 19.5V4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4 19.5h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="m7 15 3.6-4.2 3 2.6L20 6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="6.5" r="1.6" fill="currentColor"/></svg>
        <span>跟单记录</span>
      </button>
      <button class="nav-item" data-page="portfolio">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6.5" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M3 10.5h18M7.5 3.5h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="17" cy="15" r="1.2" fill="currentColor"/></svg>
        <span>模拟账户</span>
      </button>
      <button class="nav-item" data-page="strategy">
        <svg viewBox="0 0 24 24" fill="none"><path d="m12 3 8.5 4.5L12 12 3.5 7.5 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m3.5 12 8.5 4.5L20.5 12" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m3.5 16.5 8.5 4.5 8.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>为什么这样买</span>
      </button>
      <button class="nav-item" data-page="research">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="5.5" y="11" width="3.4" height="6" rx="1.2" stroke="currentColor" stroke-width="1.6"/><rect x="10.3" y="7" width="3.4" height="10" rx="1.2" stroke="currentColor" stroke-width="1.6"/><rect x="15.1" y="13.5" width="3.4" height="3.5" rx="1.2" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>靠不靠谱</span>
      </button>
      <button class="nav-item" data-page="data">
        <svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="6" rx="7.5" ry="3" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 6v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3V6" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 12v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>数据</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="foot-row">
        <span class="dot" id="footDot"></span>
        <span id="footStatus">连接中</span>
      </div>
      <div class="foot-meta" id="footMeta">—</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="pageTitle">总览</h1>
        <p id="pageSub">—</p>
      </div>
      <div class="topbar-right">
        <!-- 模式开关：纯卫星 / 核心+卫星。切换会重算今日清单（约 15 秒），
             因为两者的选股与仓位完全不同，不能只换显示。 -->
        <div class="mode-switch" id="modeSwitch" title="切换后按新配置重算今日清单">
          <button data-cw="0.5" class="is-on">核心+卫星</button>
          <button data-cw="0">纯卫星</button>
        </div>
        <div class="task-chip" id="taskChip" hidden title="任务执行中，点击查看进度">
          <svg class="ring" id="taskRing" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle class="ring-bg" cx="12" cy="12" r="9"></circle>
            <circle class="ring-fg" id="taskRingFg" cx="12" cy="12" r="9"
                    stroke-dasharray="56.55" stroke-dashoffset="42.4"></circle>
          </svg>
          <span id="taskChipText">执行中</span>
        </div>
        <button class="btn btn-icon" id="btnTheme" title="切换亮色 / 暗色">
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"
                  stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="btn btn-primary" id="btnReport" title="打开完整研究报告（新标签页）">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h7l4.5 4.5v12.5a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 3.5V8h4.5M9 13h6M9 16.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          完整报告
        </button>
        <button class="btn btn-ghost" id="btnBacktest"
                title="只重算回测（不更新行情）；耗时约 30 秒，会改掉页面上的所有数字">
          <svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l10-6.5-10-6.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          重新跑回测
        </button>
      </div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <div id="view" class="view"></div>
  </main>
</div>

<div class="logpanel" id="logPanel" hidden>
  <div class="logpanel-head">
    <div>
      <span class="log-title" id="logTitle">任务</span>
      <span class="log-status" id="logStatus"></span>
    </div>
    <button class="icon-btn" id="logClose" aria-label="关闭">✕</button>
  </div>
  <pre class="log-body" id="logBody"></pre>
</div>

<div class="tooltip" id="tooltip" hidden></div>
<div class="term-tip" id="termTip" hidden></div>
<div class="toast-wrap" id="toasts"></div>

<!-- K 线弹窗：点任意标的代码打开，纯本地缓存数据，不发网络请求 -->
<div class="kmodal" id="klineModal" hidden>
  <div class="kmodal__backdrop" data-kclose></div>
  <div class="kpanel" role="dialog" aria-modal="true" aria-labelledby="kTitle">
    <div class="kpanel__head">
      <div class="kpanel__id">
        <span class="kpanel__name" id="kTitle">—</span>
        <span class="kpanel__code mono" id="kCode"></span>
        <span class="tag" id="kCat"></span>
      </div>
      <div class="kpanel__quote">
        <span class="kpanel__last" id="kLast">—</span>
        <span class="kpanel__chg" id="kChg"></span>
      </div>
      <div class="kpanel__ranges" id="kRanges">
        <button data-bars="60">60日</button>
        <button data-bars="120">120日</button>
        <button data-bars="250" class="is-on">1年</button>
        <button data-bars="500">2年</button>
      </div>
      <button class="kpanel__x" data-kclose aria-label="关闭">✕</button>
    </div>
    <div class="kpanel__legend" id="kLegend"></div>
    <div class="kpanel__chart"><canvas id="kCanvas"></canvas></div>
    <div class="kpanel__foot" id="kFoot"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
